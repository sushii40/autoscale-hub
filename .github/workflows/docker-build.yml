name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image information
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USERNAME=$(echo "$DOCKER_USERNAME" | xargs)

          COMMIT_ID="${GITHUB_SHA::7}"

          IMAGE_NAME="$DOCKER_USERNAME/autoscale-hub"
          IMAGE_LATEST="$IMAGE_NAME:latest"
          IMAGE_VERSION="$IMAGE_NAME:$COMMIT_ID"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$COMMIT_ID" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Deployment Information"
          echo "Developer: $GITHUB_ACTOR"
          echo "Commit ID: $COMMIT_ID"
          echo "Commit Message: $GITHUB_EVENT_HEAD_COMMIT_MESSAGE"
          echo "======================================"

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          echo "Latest tag: $IMAGE_LATEST"
          echo "Version tag: $IMAGE_VERSION"

          docker build \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_VERSION" \
            .

      - name: Push Docker image
        run: |
          echo "Pushing latest image..."
          docker push "$IMAGE_LATEST"

          echo "Pushing versioned image..."
          docker push "$IMAGE_VERSION"

      - name: Deployment summary
        run: |
          echo "======================================"
          echo "AutoScale Hub Deployment"
          echo "======================================"
          echo "Developer: $GITHUB_ACTOR"
          echo "Commit: $COMMIT_ID"
          echo "Docker Image: $IMAGE_VERSION"
          echo "Status: Build and Push Successful"
          echo "======================================"